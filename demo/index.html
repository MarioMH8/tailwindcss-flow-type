<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive Tailwind CSS fluid typography configuration demo." />
    <title>flow type laboratory</title>
  </head>
  <body>
    <a class="skip-link" href="#preview">Skip to specimen</a>

    <main class="laboratory">
      <section class="preview-panel" id="preview" tabindex="-1" aria-label="Fluid typography specimen">

        <div id="specimen" class="specimen" aria-live="polite"></div>
      </section>
    </main>

    <aside id="control-panel" class="control-panel" aria-label="Configuration controls">
      <div id="pane"></div>
    </aside>

    <div class="preview-meta">
      <span id="viewport-readout" class="viewport-readout"></span>
    </div>

    <div class="floating-actions" aria-label="Demo actions">
      <a class="utility-button utility-button--github" href="https://github.com/MarioMH8/tailwindcss-flow-type" target="_blank" rel="noreferrer" aria-label="Open the GitHub repository"><img src="https://github.githubassets.com/favicons/favicon.svg" alt="" /></a>
      <button id="theme-toggle" class="utility-button" type="button" aria-label="Switch to dark mode">◐</button>
      <button id="open-css" class="floating-button floating-button--wide" type="button">CSS</button>
    </div>

    <dialog id="css-dialog" class="css-dialog" aria-labelledby="css-dialog-title">
      <div class="code-heading">
        <div>
          <span class="eyebrow">portable output</span>
          <h1 id="css-dialog-title">CSS configuration</h1>
        </div>
        <div class="dialog-actions">
          <button id="copy" class="copy-button" type="button">Copy</button>
          <button id="close-css" class="icon-button" type="button" aria-label="Close CSS configuration">×</button>
        </div>
      </div>
      <pre><code id="css-output"></code></pre>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
