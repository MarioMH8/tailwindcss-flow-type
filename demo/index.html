<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive Tailwind CSS fluid typography configuration demo." />
    <title>flow type laboratory</title>
  </head>
  <body>
    <a class="skip-link" href="#preview">Skip to specimen</a>

    <main class="laboratory">
      <section id="viewport-stage" class="viewport-stage" aria-label="Resizable viewport simulator">
        <section class="preview-panel" id="preview" tabindex="-1" aria-label="Fluid typography specimen">
          <div class="preview-meta">
            <span>drag the edge</span>
            <span id="viewport-readout" class="viewport-readout"></span>
          </div>
          <div id="specimen" class="specimen" aria-live="polite"></div>
          <button id="viewport-handle" class="viewport-handle" type="button" aria-label="Drag to resize the simulated viewport"></button>
        </section>
      </section>
    </main>

    <aside id="control-panel" class="control-panel" aria-label="Configuration controls" aria-hidden="true">
      <div class="panel-heading">
        <span class="eyebrow">parameters</span>
        <button id="close-controls" class="icon-button" type="button" aria-label="Close configuration controls">×</button>
      </div>
      <div id="pane"></div>
    </aside>

    <div class="floating-actions" aria-label="Demo actions">
      <button id="theme-toggle" class="floating-button" type="button" aria-label="Switch to dark mode">◐</button>
      <button id="open-css" class="floating-button floating-button--wide" type="button">CSS</button>
      <button id="open-controls" class="floating-button floating-button--wide" type="button" aria-expanded="false" aria-controls="control-panel">Tune</button>
    </div>

    <dialog id="css-dialog" class="css-dialog" aria-labelledby="css-dialog-title">
      <div class="code-heading">
        <div>
          <span class="eyebrow">portable output</span>
          <h1 id="css-dialog-title">CSS configuration</h1>
        </div>
        <div class="dialog-actions">
          <button id="copy" class="copy-button" type="button">Copy</button>
          <button id="close-css" class="icon-button" type="button" aria-label="Close CSS configuration">×</button>
        </div>
      </div>
      <pre><code id="css-output"></code></pre>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
